name: Apply FINAL-5J correction patch

on:
  push:
    branches:
      - agent/5j-correction-publish
    paths:
      - .github/workflows/apply-final5j-correction.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply preproduction correction patch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply preserved correction commit
        run: |
          set -euo pipefail
          base64 -d .github/ctsteg-correction.patch.gz.b64 | gzip -d > /tmp/ctsteg-correction.patch
          git config user.name 'ALIREZA ABBASZADEH'
          git config user.email 'abbaszadeh79@gmail.com'
          git am -3 /tmp/ctsteg-correction.patch
          git diff --check HEAD^ HEAD
      - name: Install test dependencies
        run: python -m pip install -e '.[research,test]'
      - name: Validate correction
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_5j_execution_plan.py' -v
          python -m unittest discover -s tests -p 'test_5j_baseline_scientific_failure.py' -v
          python -m unittest discover -s tests -p 'test_5j_dispatch.py' -v
          python -m unittest discover -s tests -p 'test_5j_baselines.py' -v
          python -m unittest discover -s tests -p 'test_5j_runner_preflight.py' -v
          python scripts/5j/validate_protocol.py
          python scripts/5j/validate_inputs.py --check-files --require-science-ready --json
      - name: Remove one-shot publisher and push verified tree
        run: |
          set -euo pipefail
          git rm .github/ctsteg-correction.patch.gz.b64 .github/workflows/apply-final5j-correction.yml
          git commit -m 'chore: remove one-shot FINAL-5J correction publisher'
          git push origin HEAD:agent/5j-correction-publish
