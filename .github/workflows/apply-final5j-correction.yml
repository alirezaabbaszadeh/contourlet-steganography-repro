name: Apply FINAL-5J correction patch

on:
  push:
    branches:
      - agent/5j-correction-publish
    paths:
      - .github/workflows/apply-final5j-correction.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply preserved correction commit to exact base
        run: |
          set -euo pipefail
          cp .github/ctsteg-correction.patch.gz.b64 /tmp/ctsteg-correction.patch.gz.b64
          git checkout --detach f091d5a8fffeaa89bb9f00040420574674777ef6
          base64 -d /tmp/ctsteg-correction.patch.gz.b64 | gzip -d > /tmp/ctsteg-correction.patch
          git config user.name 'ALIREZA ABBASZADEH'
          git config user.email 'abbaszadeh79@gmail.com'
          git am -3 /tmp/ctsteg-correction.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/5j/FINAL5J_PREPRODUCTION_CORRECTION_20260812.md')
          p.write_text('\n'.join(line.rstrip() for line in p.read_text(encoding='utf-8').splitlines()) + '\n', encoding='utf-8')
          PY
          git add docs/5j/FINAL5J_PREPRODUCTION_CORRECTION_20260812.md
          git commit --amend --no-edit
          git diff --check HEAD^ HEAD
          test "$(git rev-parse HEAD^{tree})" = '4752209630965ac770217f27679de36bcf58fab4'
      - name: Install test dependencies
        run: python -m pip install -e '.[research,test]'
      - name: Validate correction
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_5j_execution_plan.py' -v
          python -m unittest discover -s tests -p 'test_5j_baseline_scientific_failure.py' -v
          python -m unittest discover -s tests -p 'test_5j_dispatch.py' -v
          python -m unittest discover -s tests -p 'test_5j_baselines.py' -v
          python -m unittest discover -s tests -p 'test_5j_runner_preflight.py' -v
          python scripts/5j/validate_protocol.py
          python scripts/5j/validate_inputs.py --check-files --require-science-ready --json
      - name: Publish verified correction atomically
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'f091d5a8fffeaa89bb9f00040420574674777ef6'
          test "$(git rev-parse HEAD^{tree})" = '4752209630965ac770217f27679de36bcf58fab4'
          git push origin HEAD:agent/server-control-plane
