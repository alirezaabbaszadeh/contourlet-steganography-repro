name: manuscript

on:
  workflow_dispatch:
  push:
    branches:
      - agent/server-control-plane
      - paper/final-5j
    tags:
      - "SCIENTIFIC-REPORTS-TECHNICAL-CANDIDATE-*"
    paths:
      - "manuscript.tex"
      - "supplementary_information.tex"
      - "paper/**"
      - "figures/**"
      - "publication/**"
      - "submission/**"
      - "scripts/5j/build_tables.py"
      - "scripts/5j/build_figures.py"
      - ".github/workflows/manuscript.yml"
  pull_request:
    paths:
      - "manuscript.tex"
      - "supplementary_information.tex"
      - "paper/**"
      - "figures/**"
      - "publication/**"
      - "submission/**"
      - "scripts/5j/build_tables.py"
      - "scripts/5j/build_figures.py"
      - ".github/workflows/manuscript.yml"

permissions:
  contents: write

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science

      - name: Audit manuscript citation sequence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ordered_sources = [
              Path("paper/01_frontmatter.tex"),
              Path("paper/02_system.tex"),
              Path("paper/03_methods.tex"),
              Path("paper/04_results.tex"),
              Path("paper/05_discussion.tex"),
          ]
          seen = []
          for path in ordered_sources:
              text = path.read_text()
              for match in re.finditer(r"\\cite\w*\{([^}]+)\}", text):
                  for key in (x.strip() for x in match.group(1).split(",")):
                      if key and key not in seen:
                          seen.append(key)

          back = Path("paper/06_backmatter.tex").read_text()
          bib = re.findall(r"\\bibitem(?:\[[^\]]*\])?\{([^}]+)\}", back)
          if seen != bib:
              raise SystemExit(
                  "bibliography order/citation coverage mismatch\n"
                  f"first appearance: {seen}\n"
                  f"bibliography:     {bib}"
              )
          print("citation sequence audit PASS:", len(bib), "cited references")
          PY

      - name: Build main manuscript from tracked FINAL-5J publication inputs
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex

      - name: Build supplementary information
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error supplementary_information.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplementary_information.tex

      - name: Validate final LaTeX logs
        run: |
          set -euo pipefail
          bad='(LaTeX Warning:|Package .* Warning:|Overfull \\[hv]box|Underfull \\[hv]box|undefined citations|undefined references)'
          if grep -nE "$bad" manuscript.log supplementary_information.log; then
            echo "Final-pass LaTeX warnings detected."
            exit 1
          fi
          echo "Final-pass LaTeX log audit PASS."

      - name: Build Scientific Reports technical submission package
        run: |
          set -euo pipefail
          rm -rf submission-build scientific-reports-technical-submission-candidate.zip
          mkdir -p submission-build/figures
          cp manuscript.pdf submission-build/manuscript.pdf
          cp supplementary_information.pdf submission-build/supplementary_information.pdf

          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory=submission-build/figures \
            submission/scientific-reports/figure1.tex
          mv submission-build/figures/figure1.pdf submission-build/figures/Figure_1.pdf
          rm -f submission-build/figures/figure1.aux \
                submission-build/figures/figure1.log \
                submission-build/figures/figure1.out

          cp docs/5j/final-run-20260812/figures/figure_failure_stages.pdf \
            submission-build/figures/Figure_2.pdf
          cp docs/5j/final-run-20260812/figures/figure_primary_complete_recovery_effects.pdf \
            submission-build/figures/Figure_3.pdf
          cp docs/5j/final-run-20260812/figures/figure_complete_recovery.pdf \
            submission-build/figures/Figure_4.pdf
          cp Cover_Letter_Nature_Portfolio.md submission-build/cover_letter_draft.md
          cp submission/scientific-reports/AUTHOR_INPUTS_REQUIRED.txt submission-build/

          cat > submission-build/README_SUBMISSION_PACKAGE.txt <<EOF
          Scientific Reports technical submission candidate
          Source branch: ${GITHUB_REF_NAME}
          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}

          Contents:
          - manuscript.pdf
          - supplementary_information.pdf
          - figures/Figure_1.pdf through Figure_4.pdf
          - cover_letter_draft.md
          - AUTHOR_INPUTS_REQUIRED.txt
          - SHA256SUMS.txt

          This is a technical candidate. Author-controlled metadata remains unresolved
          until the corresponding author explicitly supplies and confirms it.
          EOF

          (
            cd submission-build
            sha256sum \
              manuscript.pdf \
              supplementary_information.pdf \
              figures/Figure_1.pdf \
              figures/Figure_2.pdf \
              figures/Figure_3.pdf \
              figures/Figure_4.pdf \
              cover_letter_draft.md \
              AUTHOR_INPUTS_REQUIRED.txt \
              README_SUBMISSION_PACKAGE.txt \
              > SHA256SUMS.txt
          )

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('submission-build')
          out = Path('scientific-reports-technical-submission-candidate.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      zf.write(path, path.relative_to(root))
          print(out, out.stat().st_size)
          PY

      - name: Upload Scientific Reports technical package
        uses: actions/upload-artifact@v4
        with:
          name: scientific-reports-technical-submission-candidate
          path: |
            scientific-reports-technical-submission-candidate.zip
            submission-build/**
          if-no-files-found: error

      - name: Publish tagged technical candidate prerelease
        if: startsWith(github.ref, 'refs/tags/SCIENTIFIC-REPORTS-TECHNICAL-CANDIDATE-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            scientific-reports-technical-submission-candidate.zip \
            --prerelease \
            --title "Scientific Reports technical candidate $GITHUB_REF_NAME" \
            --notes "Technical submission candidate generated from source commit $GITHUB_SHA. Author-controlled metadata remains pending and this is not the final submitted version."

      - name: Upload publication package
        uses: actions/upload-artifact@v4
        with:
          name: final-5j-manuscript-pdfs
          path: |
            manuscript.pdf
            supplementary_information.pdf
            figures/**
            publication/tables/**
            publication/figures/**
          if-no-files-found: warn
