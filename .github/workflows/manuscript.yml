name: manuscript

on:
  workflow_dispatch:
  push:
    paths:
      - "manuscript.tex"
      - "supplementary_information.tex"
      - "paper/**"
      - "figures/**"
      - "scripts/build_panel_from_archives.py"
      - "scripts/build_representative_panel.py"
      - ".github/workflows/manuscript.yml"
  pull_request:
    paths:
      - "manuscript.tex"
      - "supplementary_information.tex"
      - "paper/**"
      - "figures/**"
      - "scripts/build_panel_from_archives.py"
      - "scripts/build_representative_panel.py"
      - ".github/workflows/manuscript.yml"

permissions:
  contents: read

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install publication dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy pillow
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science

      - name: Build representative panel from published archives
        run: |
          python scripts/build_panel_from_archives.py \
            --capsule CTSteg-reproduction-capsule-20260730.tar.gz \
            --results CTSteg-final-PDFB-v2-f7acf6d9.tar.gz \
            --work-dir .publication-archive \
            --output figures/representative-pair.png
          test -s figures/representative-pair.pdf
          test -s figures/representative-pair.json
          test -s figures/representative-pair-selection.json

      - name: Build main manuscript
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex

      - name: Build supplementary information
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error supplementary_information.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplementary_information.tex

      - name: Upload publication package
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdfs
          path: |
            manuscript.pdf
            supplementary_information.pdf
            figures/representative-pair.png
            figures/representative-pair.pdf
            figures/representative-pair.json
            figures/representative-pair-selection.json
          if-no-files-found: error
