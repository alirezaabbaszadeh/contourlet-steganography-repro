name: manuscript

on:
  workflow_dispatch:
  push:
    paths:
      - "manuscript.tex"
      - "supplementary_information.tex"
      - "paper/**"
      - "figures/**"
      - ".github/workflows/manuscript.yml"
  pull_request:
    paths:
      - "manuscript.tex"
      - "supplementary_information.tex"
      - "paper/**"
      - "figures/**"
      - ".github/workflows/manuscript.yml"

permissions:
  contents: read

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory published research archives
        run: |
          tar -tzf CTSteg-reproduction-capsule-20260730.tar.gz > capsule-inventory.txt
          tar -tzf CTSteg-final-PDFB-v2-f7acf6d9.tar.gz > result-inventory.txt
          echo "=== Capsule paths relevant to manuscript images ==="
          grep -Ei '(manifest|pair|input|cover|secret|stego|recover|\.png$|\.jpe?g$|\.csv$|\.json$|\.parquet$)' capsule-inventory.txt | head -n 300 || true
          echo "=== Result paths relevant to manuscript images ==="
          grep -Ei '(manifest|pair|input|cover|secret|stego|recover|\.png$|\.jpe?g$|\.csv$|\.json$|\.parquet$)' result-inventory.txt | head -n 500 || true
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science
      - name: Build main manuscript
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex
      - name: Build supplementary information
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error supplementary_information.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplementary_information.tex
      - name: Record representative-panel status
        run: |
          if test -f figures/representative-pair.pdf; then
            echo "Representative image panel is included."
          else
            echo "Representative image panel is pending archive extraction."
          fi
      - name: Upload publication PDFs and archive inventories
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdfs
          path: |
            manuscript.pdf
            supplementary_information.pdf
            capsule-inventory.txt
            result-inventory.txt
          if-no-files-found: error
