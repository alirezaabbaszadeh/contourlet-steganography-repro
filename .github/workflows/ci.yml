name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen P0
        run: python scripts/check_p0_frozen.py
      - name: Digital transform audit
        run: >-
          ctsteg audit-transform
          --config configs/digital_ad/format_v1.toml
          --output results/digital-transform-audit.json
      - name: PDFB Stage-0 plan smoke
        run: >-
          ctsteg pdfb-plan
          --spec configs/digital_ad/pdfb_matlab_gate_v1.toml
          --toolbox-path /opt/contourlet_toolbox
          --raw-evidence results/pdfb-stage0/pdfb-audit-raw.json
          --output results/pdfb-stage0-plan.json
          --matlab-scripts matlab
      - name: Digital A+D smoke
        run: >-
          ctsteg digital-demo
          --config configs/digital_ad/stage2_c0_clean.toml
          --method C0_FIXED
          --attack-profile none
          --output-dir results/digital-c0
      - name: Deterministic smoke run
        run: ctsteg demo --output-dir results/source --size 128 --skip-attacks
      - name: Build smoke manifest
        run: >-
          python -c
          "from pathlib import Path;
          Path('results/pairs.csv').write_text(
          'pair_id,cover,secret,split,seed\\n'
          'synthetic,source/cover.png,source/secret.png,ci,2026\\n',
          encoding='utf-8')"
      - name: Batch benchmark smoke
        run: >-
          ctsteg benchmark
          --manifest results/pairs.csv
          --config configs/smoke.toml
          --output-dir results/batch
          --skip-attacks
      - name: Paired analysis smoke
        run: >-
          ctsteg compare
          --baseline results/batch/results_long.csv
          --proposed results/batch/results_long.csv
          --output-dir results/self-comparison
          --bootstrap-resamples 256
          --permutation-resamples 256
