name: 5J runner preflight

on:
  push:
    paths:
      - "src/ctsteg/digital_ad/runtime_5j.py"
      - "scripts/5j/run_research.py"
      - "scripts/5j/research_status.py"
      - "scripts/5j/build_execution_plan.py"
      - "tests/test_5j_runner_preflight.py"
      - "tests/test_5j_execution_plan.py"
      - ".github/workflows/5j-runner-preflight.yml"
  pull_request:
    paths:
      - "src/ctsteg/digital_ad/runtime_5j.py"
      - "scripts/5j/run_research.py"
      - "scripts/5j/research_status.py"
      - "scripts/5j/build_execution_plan.py"
      - "tests/test_5j_runner_preflight.py"
      - "tests/test_5j_execution_plan.py"
      - ".github/workflows/5j-runner-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile runner modules
        run: python -m py_compile src/ctsteg/digital_ad/runtime_5j.py scripts/5j/run_research.py scripts/5j/research_status.py tests/test_5j_runner_preflight.py
      - name: Verify expanded execution plan contract
        run: python -m unittest discover -s tests -p "test_5j_execution_plan.py" -v
      - name: Verify preflight identity and status reconstruction
        run: python -m unittest discover -s tests -p "test_5j_runner_preflight.py" -v
