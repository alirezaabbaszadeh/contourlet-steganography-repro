name: Apply FINAL-5J issue 10 correction

on:
  push:
    branches:
      - agent/5j-internal-failure-publish
    paths:
      - .github/workflows/apply-final5j-issue10.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact tested issue 10 patch
        run: |
          set -euo pipefail
          cp .github/ctsteg-issue10.patch.gz.b64 /tmp/ctsteg-issue10.patch.gz.b64
          git checkout --detach 0005cba51a09ab0c062bfc4bd21a499fa501841c
          base64 -d /tmp/ctsteg-issue10.patch.gz.b64 | gzip -d > /tmp/ctsteg-issue10.patch
          git config user.name 'ALIREZA ABBASZADEH'
          git config user.email 'abbaszadeh79@gmail.com'
          git am -3 /tmp/ctsteg-issue10.patch
          git diff --check HEAD^ HEAD
          test "$(git rev-parse HEAD^)" = '0005cba51a09ab0c062bfc4bd21a499fa501841c'
          test "$(git rev-parse HEAD^{tree})" = '8e50380493ae6217638246b8047afd0b7ec84c53'
      - name: Install test dependencies
        run: python -m pip install -e '.[research,test]'
      - name: Validate issue 10 correction
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_5j_internal_worker.py' -v
          python -m unittest discover -s tests -p 'test_5j_dispatch.py' -v
          python -m unittest discover -s tests -p 'test_5j_failure_severity.py' -v
          python -m unittest discover -s tests -p 'test_5j_analysis.py' -v
          python scripts/5j/validate_protocol.py
          python scripts/5j/validate_inputs.py --check-files --require-science-ready --json
          python scripts/5j/validate_baseline_freeze.py --json
      - name: Publish verified correction atomically
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '0005cba51a09ab0c062bfc4bd21a499fa501841c'
          test "$(git rev-parse HEAD^{tree})" = '8e50380493ae6217638246b8047afd0b7ec84c53'
          git push origin HEAD:agent/server-control-plane
