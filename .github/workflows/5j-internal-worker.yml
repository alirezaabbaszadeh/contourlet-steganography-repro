name: 5J internal worker

on:
  push:
    paths:
      - "src/ctsteg/digital_ad/runtime_tasks_5j.py"
      - "src/ctsteg/digital_ad/runtime_worker_5j.py"
      - "src/ctsteg/digital_ad/failure_severity.py"
      - "scripts/5j/run_internal_task.py"
      - "tests/test_5j_internal_worker.py"
      - "tests/test_5j_failure_severity.py"
      - ".github/workflows/5j-internal-worker.yml"
  pull_request:
    paths:
      - "src/ctsteg/digital_ad/runtime_tasks_5j.py"
      - "src/ctsteg/digital_ad/runtime_worker_5j.py"
      - "src/ctsteg/digital_ad/failure_severity.py"
      - "scripts/5j/run_internal_task.py"
      - "tests/test_5j_internal_worker.py"
      - "tests/test_5j_failure_severity.py"
      - ".github/workflows/5j-internal-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-internal-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile worker modules
        run: python -m py_compile src/ctsteg/digital_ad/runtime_tasks_5j.py src/ctsteg/digital_ad/runtime_worker_5j.py src/ctsteg/digital_ad/failure_severity.py scripts/5j/run_internal_task.py tests/test_5j_internal_worker.py tests/test_5j_failure_severity.py
      - name: Verify failure-severity diagnostics
        run: python -m unittest discover -s tests -p "test_5j_failure_severity.py" -v
      - name: Verify durable internal worker objects
        run: python -m unittest discover -s tests -p "test_5j_internal_worker.py" -v
