name: 5J baselines and local dispatcher

on:
  push:
    paths:
      - "src/ctsteg/digital_ad/baselines_5j.py"
      - "src/ctsteg/digital_ad/runtime_baseline_worker_5j.py"
      - "src/ctsteg/digital_ad/runtime_dispatch_5j.py"
      - "scripts/5j/run_task.py"
      - "scripts/5j/dispatch_research.py"
      - "tests/test_5j_baselines.py"
      - "tests/test_5j_dispatch.py"
      - "docs/5j/baselines/**"
      - "configs/5j/baseline_registry_v1.json"
      - ".github/workflows/5j-baselines.yml"
  pull_request:
    paths:
      - "src/ctsteg/digital_ad/baselines_5j.py"
      - "src/ctsteg/digital_ad/runtime_baseline_worker_5j.py"
      - "src/ctsteg/digital_ad/runtime_dispatch_5j.py"
      - "scripts/5j/run_task.py"
      - "scripts/5j/dispatch_research.py"
      - "tests/test_5j_baselines.py"
      - "tests/test_5j_dispatch.py"
      - "docs/5j/baselines/**"
      - "configs/5j/baseline_registry_v1.json"
      - ".github/workflows/5j-baselines.yml"

permissions:
  contents: read

jobs:
  baseline-contract-clean-roundtrip-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Compile baseline and dispatcher runtime
        run: |
          python -m py_compile src/ctsteg/digital_ad/baselines_5j.py
          python -m py_compile src/ctsteg/digital_ad/runtime_baseline_worker_5j.py
          python -m py_compile src/ctsteg/digital_ad/runtime_dispatch_5j.py
          python -m py_compile scripts/5j/run_task.py
          python -m py_compile scripts/5j/dispatch_research.py
      - name: Validate baseline contracts and scaffolding
        run: python scripts/5j/validate_inputs.py --json
      - name: Run baseline and dispatcher tests
        run: >-
          python -m pytest -q
          tests/test_5j_baselines.py
          tests/test_5j_dispatch.py
