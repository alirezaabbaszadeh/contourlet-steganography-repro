name: 5J seven-method engineering dry run contract

on:
  push:
    paths:
      - "src/ctsteg/digital_ad/engineering_dry_run_5j.py"
      - "src/ctsteg/digital_ad/runtime_5j.py"
      - "src/ctsteg/digital_ad/runtime_dispatch_5j.py"
      - "scripts/5j/run_engineering_dry_run.py"
      - "tests/test_5j_engineering_dry_run.py"
      - ".github/workflows/5j-engineering-dry-run.yml"
  pull_request:
    paths:
      - "src/ctsteg/digital_ad/engineering_dry_run_5j.py"
      - "src/ctsteg/digital_ad/runtime_5j.py"
      - "src/ctsteg/digital_ad/runtime_dispatch_5j.py"
      - "scripts/5j/run_engineering_dry_run.py"
      - "tests/test_5j_engineering_dry_run.py"
      - ".github/workflows/5j-engineering-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Verify seven-method engineering plan contract
        run: python -m unittest discover -s tests -p "test_5j_engineering_dry_run.py" -v
