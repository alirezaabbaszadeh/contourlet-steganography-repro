name: Materialize frozen 5J COCO dataset

on:
  workflow_dispatch:
  push:
    branches:
      - agent/runtime-resume-gate
    paths:
      - ".github/workflows/5j-materialize-coco-dataset.yml"
  pull_request:
    branches:
      - agent/research-documentation
    paths:
      - ".github/workflows/5j-materialize-coco-dataset.yml"

permissions:
  contents: write

concurrency:
  group: materialize-final-5j-coco-dataset
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[test]'

      - name: Compile data materialization commands
        run: |
          python -m py_compile scripts/5j/prepare_coco_candidates.py
          python -m py_compile scripts/5j/bootstrap_coco_data.py
          python -m py_compile scripts/5j/freeze_data_manifests.py
          python -m py_compile scripts/5j/materialize_coco_snapshot.py
          python -m py_compile scripts/5j/validate_inputs.py

      - name: Download, preprocess, and freeze COCO data
        run: python scripts/5j/bootstrap_coco_data.py

      - name: Build sanitized Git snapshot metadata
        run: python scripts/5j/materialize_coco_snapshot.py

      - name: Validate frozen inputs and exact image hashes
        run: python scripts/5j/validate_inputs.py --check-files --require-science-ready --json

      - name: Enforce repository dataset size bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('data/5j/coco2017/prepared')
          files = sorted(root.glob('covers/*.png')) + sorted(root.glob('secrets/*.png'))
          if len(files) != 108:
              raise SystemExit(f'expected 108 derived PNGs, found {len(files)}')
          maximum = max(path.stat().st_size for path in files)
          total = sum(path.stat().st_size for path in files)
          if maximum >= 10 * 1024 * 1024:
              raise SystemExit(f'derived PNG exceeds 10 MiB: {maximum}')
          if total >= 100 * 1024 * 1024:
              raise SystemExit(f'derived PNG set exceeds 100 MiB: {total}')
          print({'png_count': len(files), 'png_bytes': total, 'largest_png_bytes': maximum})
          PY

      - name: Remove untracked raw COCO downloads
        run: |
          rm -f data/5j/coco2017/annotations_trainval2017.zip
          rm -rf data/5j/coco2017/annotations
          rm -rf data/5j/coco2017/val2017
          rm -f data/5j/coco2017/prepared/preparation_report.json

      - name: Commit exact experiment bytes and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/5j/coco2017/prepared/covers \
            data/5j/coco2017/prepared/secrets \
            data/5j/coco2017/prepared/candidate_pairs.csv \
            data/5j/coco2017/prepared/SOURCE_METADATA.json \
            data/5j/coco2017/prepared/ATTRIBUTION.md \
            data/5j/coco2017/prepared/SNAPSHOT.json \
            data-manifests/5j/calibration.csv \
            data-manifests/5j/dry_run.csv \
            data-manifests/5j/main_50_pairs.csv \
            data-manifests/5j/sweep_10_pairs.csv \
            data-manifests/5j/data_freeze_report.json \
            configs/5j/data_registry_v1.json
          if git diff --cached --quiet; then
            echo "Frozen COCO snapshot already matches Git."
            exit 0
          fi
          git commit -m "Materialize frozen COCO dataset for FINAL-5J-v1"
          git push origin "HEAD:${TARGET_BRANCH}"
