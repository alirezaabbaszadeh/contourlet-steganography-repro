name: 5J analysis and reporting

on:
  push:
    paths:
      - "src/ctsteg/digital_ad/analysis_5j.py"
      - "scripts/5j/build_analysis.py"
      - "scripts/5j/build_tables.py"
      - "scripts/5j/build_figures.py"
      - "tests/test_5j_analysis.py"
      - "tests/test_5j_reporting.py"
      - ".github/workflows/5j-analysis.yml"
  pull_request:
    paths:
      - "src/ctsteg/digital_ad/analysis_5j.py"
      - "scripts/5j/build_analysis.py"
      - "scripts/5j/build_tables.py"
      - "scripts/5j/build_figures.py"
      - "tests/test_5j_analysis.py"
      - "tests/test_5j_reporting.py"
      - ".github/workflows/5j-analysis.yml"

permissions:
  contents: read

jobs:
  pair-level-analysis-and-publication-outputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[research,test]'
      - name: Compile analysis commands
        run: |
          python -m py_compile src/ctsteg/digital_ad/analysis_5j.py
          python -m py_compile scripts/5j/build_analysis.py
          python -m py_compile scripts/5j/build_tables.py
          python -m py_compile scripts/5j/build_figures.py
      - name: Run pair-level analysis tests
        run: >-
          python -m pytest -q
          tests/test_5j_analysis.py
          tests/test_5j_reporting.py
