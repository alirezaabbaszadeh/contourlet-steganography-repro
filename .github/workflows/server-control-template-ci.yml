name: server-control-template-ci

on:
  push:
    branches:
      - agent/server-control-plane
    paths:
      - "control/**"
      - "tests/test_server_control_*.py"
      - ".github/workflows/server-control-template-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run staged control-plane tests
        run: python -m unittest discover -s tests -p "test_server_control_*.py" -v
