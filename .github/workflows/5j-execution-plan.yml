name: 5J execution plan

on:
  push:
    paths:
      - "configs/5j/study_plan_v1.json"
      - "configs/5j/seeds.lock.json"
      - "configs/5j/baseline_registry_v1.json"
      - "configs/5j/format_v2_layer_integrity.toml"
      - "schemas/5j/execution_plan.schema.json"
      - "scripts/5j/build_execution_plan.py"
      - "tests/test_5j_execution_plan.py"
      - ".github/workflows/5j-execution-plan.yml"
  pull_request:
    paths:
      - "configs/5j/study_plan_v1.json"
      - "configs/5j/seeds.lock.json"
      - "configs/5j/baseline_registry_v1.json"
      - "configs/5j/format_v2_layer_integrity.toml"
      - "schemas/5j/execution_plan.schema.json"
      - "scripts/5j/build_execution_plan.py"
      - "tests/test_5j_execution_plan.py"
      - ".github/workflows/5j-execution-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-task-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile execution planner
        run: python -m py_compile scripts/5j/build_execution_plan.py tests/test_5j_execution_plan.py
      - name: Expand synthetic frozen inputs
        run: python -m unittest discover -s tests -p "test_5j_execution_plan.py" -v
      - name: Confirm production plan is still blocked
        run: python -c "import subprocess,sys,tempfile,pathlib; p=pathlib.Path(tempfile.mkdtemp())/'plan.json'; r=subprocess.run([sys.executable,'scripts/5j/build_execution_plan.py','--output',str(p)]); assert r.returncode != 0"
