# FINAL-5J-v1 layer-integrity configuration.
#
# This is a new protocol namespace. It must not reuse the previous format-v1
# run ID or overwrite any object from the validated 88-evaluation archive.
# The PDFB runtime/toolbox/evidence paths remain external immutable bindings.
#
# Required runtime bindings:
#   CTSTEG_PDFB_TOOLBOX_PATH=/opt/ctsteg/toolboxes/contourlet-real
#   CTSTEG_PDFB_RUNTIME=/usr/bin/octave-cli
#   CTSTEG_PDFB_STAGE0_EVIDENCE=<frozen verified stage-0 evidence path>

[digital_ad]
format_version = 2
cover_size = 512
secret_size = 128
grayscale_policy = "pillow_l"
resize_kernel = "bicubic"
rounding_policy = "half_up"
transform_profile = "octave_pdfb_9_7_pkva_nlev_2222_p3p4_range_v2"
levels = 4
directions = 4
angular_concentration = 8.0
gaussian_sigma = 1.0
eligible_level = 0
master_seed = 2026
psnr_target_db = 45.0
psnr_tolerance_db = 0.1
lambda_low = 0.0
lambda_high = 16.0
lambda_iterations = 24
entropy_bins = 64
adaptive_weight_min = 0.75
adaptive_weight_max = 1.25
allocation_epsilon = 1e-12
robust_clip = 3.0
clean_decode_required = true
