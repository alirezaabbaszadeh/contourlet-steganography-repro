[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contourlet-steganography-repro"
version = "0.5.0"
description = "Contourlet-Domain Image Data Hiding for Visual Communication: Adaptive Allocation and Validity-Aware Recovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Alireza Abbaszadeh", email = "alireza.abbaszadeh8558@iau.ir" },
  { name = "Mohammad Hossein Moattar", email = "mhmoattar@iau.ac.ir" },
]
keywords = [
  "image-data-hiding",
  "contourlet-transform",
  "hidden-image-communication",
  "unequal-error-protection",
  "validity-aware-recovery",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "Pillow>=10,<13",
  "matplotlib>=3.8,<4",
]

[project.scripts]
ctsteg = "ctsteg.cli:main"

[project.urls]
Repository = "https://github.com/alirezaabbaszadeh/contourlet-steganography-repro"
Paper = "https://doi.org/10.1038/s41598-026-41168-0"
Dataset = "https://sipi.usc.edu/database/database.php?volume=misc"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
