name: Ferdowsi server control

on:
  push:
    paths:
      - "requests/*.json"

permissions:
  contents: read

concurrency:
  group: ferdowsi-server-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: [self-hosted, linux, x64, ctsteg-ferdowsi-8c16g]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate and execute the single HEAD request
        run: python3 -m control.head_request --repo-root "$GITHUB_WORKSPACE"
